# ==============================================================================
# deploy/nginx/perf-log-format.conf
# High-Performance JSON Log Format with Request Timing & Request ID Correlation
# ==============================================================================

# Define structured JSON log format capturing end-to-end request duration ($request_time),
# backend upstream round-trip duration ($upstream_response_time), and X-Request-ID.
log_format pulse_perf_json escape=json '{'
    '"time_iso8601": "$time_iso8601",'
    '"remote_addr": "$remote_addr",'
    '"request_id": "$http_x_request_id",'
    '"request_method": "$request_method",'
    '"request_uri": "$request_uri",'
    '"status": $status,'
    '"body_bytes_sent": $body_bytes_sent,'
    '"request_time": $request_time,'                      # Full client-to-nginx request duration in seconds (float)
    '"upstream_response_time": "$upstream_response_time",'# Fastify backend processing duration in seconds
    '"upstream_connect_time": "$upstream_connect_time",'  # TCP socket connect time to backend
    '"upstream_header_time": "$upstream_header_time",'    # Time to receive first byte of headers
    '"upstream_addr": "$upstream_addr",'
    '"upstream_status": "$upstream_status",'
    '"http_user_agent": "$http_user_agent",'
    '"http_referer": "$http_referer"'
'}';

# Usage Example in nginx server/location block:
