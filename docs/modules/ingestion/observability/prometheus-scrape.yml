# Prometheus scrape example for ingestion worker metrics.
#
# Replace the static target with the service DNS name, pod annotation discovery,
# or service monitor endpoint used by the deployment. The worker exposes
# GET /metrics on INGESTION_WORKER_METRICS_PORT, which defaults to 9465.
scrape_configs:
  - job_name: pulsiv-ingestion-workers
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingestion-worker:9465
    metric_relabel_configs:
      # Keep low-cardinality ingestion metrics needed for the optimization SLOs.
      - source_labels: [__name__]
        regex: "ingest_(jobs_processed_total|jobs_failed_total|jobs_retried_total|events_received_total|events_inserted_total|events_rejected_total|events_deferred_total|events_failed_total|batches_processed_by_type_total|events_received_by_type_total|events_inserted_by_type_total|events_rejected_by_type_total|batch_bytes_total|events_duplicate_total|events_failed_by_reason_total|fairness_deferred_jobs_total|fairness_processed_jobs_total|fairness_starvation_guard_admissions_total|worker_inflight_jobs|worker_configured_slots|processing_latency_ms_.*|e2e_latency_ms_.*|stage_latency_ms_.*|db_query_duration_ms_.*|db_queries_per_batch_.*|events_per_batch_.*|batch_bytes_.*|queue_depth_.*|queue_ready_jobs|queue_deferred_jobs|queue_oldest_pending_job_age_ms.*|dlq_retained_jobs.*|db_pool_connections)"
        action: keep
