x-common-environment: &common-environment
  NODE_ENV: production
  UV_THREADPOOL_SIZE: "8"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  DB_FAMILY: ${DB_FAMILY:-0}
  LOG_DB_PRIMARY: ${LOG_DB_PRIMARY:-}
  LOG_DB_REPLICA: ${LOG_DB_REPLICA:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_POOL_MIN: ${DB_POOL_MIN:-0}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
  LOG_POOL_MAX: ${LOG_POOL_MAX:-20}
  LOG_POOL_MIN: ${LOG_POOL_MIN:-0}
  LOG_DB_IDLE_TIMEOUT: ${LOG_DB_IDLE_TIMEOUT:-30000}
  LOG_DB_CONNECTION_TIMEOUT: ${LOG_DB_CONNECTION_TIMEOUT:-10000}
  QUEUE_POOL_MAX: ${QUEUE_POOL_MAX:-20}
  QUEUE_COMMAND_POOL_MAX: ${QUEUE_COMMAND_POOL_MAX:-5}
  INGESTION_DB_POOL_SIZE: ${INGESTION_DB_POOL_SIZE:-8}
  INGESTION_WRITE_POOL_SIZE: ${INGESTION_WRITE_POOL_SIZE:-20}
  ANALYTICS_DB_POOL_MAX: ${ANALYTICS_DB_POOL_MAX:-4}
  STARTUP_DB_RETRY_MAX_ATTEMPTS: ${STARTUP_DB_RETRY_MAX_ATTEMPTS:-8}
  STARTUP_DB_RETRY_BASE_DELAY_MS: ${STARTUP_DB_RETRY_BASE_DELAY_MS:-2000}
  STARTUP_DB_RETRY_MAX_DELAY_MS: ${STARTUP_DB_RETRY_MAX_DELAY_MS:-15000}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
  QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE:-50}
  QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-60}
  QUEUE_POLL_SECONDS: ${QUEUE_POLL_SECONDS:-2}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
  COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set}
  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be exactly 32 characters}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *common-environment
      PROCESS_ROLE: api
      PORT: "3000"
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${STARTUP_HEALTH_START_PERIOD:-700s}

  workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/shared/workers/main.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: worker
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  ingestion-workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/shared/workers/ingestion-worker-main.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: ingestion
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  analytics-workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/shared/workers/analytics-worker-main.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: analytics
      ANALYTICS_ENGINE_ENABLED: ${ANALYTICS_ENGINE_ENABLED:-true}
      ANALYTICS_HEALTH_PORT: "9301"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9301/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${STARTUP_HEALTH_START_PERIOD:-700s}
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.0"

  # General workers already own alerting and scheduled maintenance queues. Do
  # not launch alert-only or cron entry points concurrently unless those queue
  # groups are explicitly removed from the general worker role.

  postgres:
    profiles: ["local-dev"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_monitoring
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: ["local-dev"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
