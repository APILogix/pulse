# ==============================================================================
# postgresql.monitoring.conf
# Recommended PostgreSQL 16 / 17 Performance Monitoring Configuration
#
# Include this file in your postgresql.conf or mount into conf.d/
# e.g.: include_if_exists = '/etc/postgresql/conf.d/postgresql.monitoring.conf'
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SHARED PRELOAD LIBRARIES
# Must be configured in postgresql.conf at cluster startup (requires server restart).
# On PrimaryDB: 'pg_stat_statements'
# On LogDB:     'pg_stat_statements,timescaledb'
# ------------------------------------------------------------------------------
# shared_preload_libraries = 'pg_stat_statements,timescaledb'

# ------------------------------------------------------------------------------
# 2. QUERY IDENTIFICATION (PostgreSQL 14+)
# Automatically computes a 64-bit query identifier hash for every normalized query.
# ------------------------------------------------------------------------------
compute_query_id = on

# ------------------------------------------------------------------------------
# 3. PG_STAT_STATEMENTS CONFIGURATION
# ------------------------------------------------------------------------------

# Controls which statements are counted:
# - 'top': Only statements executed directly by clients.
# - 'all': Also includes statements invoked within functions/procedures.
# Choice: 'top' is recommended for high-throughput production workloads.
# Justification: 'top' accurately measures application-dispatched queries and PgBouncer
# transactions without polluting stats with internal PL/pgSQL loops (such as PGMQ polling
# or TimescaleDB continuous aggregate workers). This prevents hash table eviction and
# avoids spinlock contention under 50,000+ RPS.
pg_stat_statements.track = top

# Maximum number of unique normalized query shapes tracked in shared memory.
# 5000 is optimal for typical microservice architectures, consuming ~8-12 MB of shared RAM.
pg_stat_statements.max = 5000

# Exclude utility commands (BEGIN, COMMIT, SET, VACUUM, ANALYZE, CHECKPOINT).
# Set to 'off' to keep the buffer focused on SELECT, INSERT, UPDATE, and DELETE.
pg_stat_statements.track_utility = off

# Persist query statistics across clean database server restarts.
pg_stat_statements.save = on

# ------------------------------------------------------------------------------
# 4. I/O TIMING INSTRUMENTATION
# ------------------------------------------------------------------------------

# Enables timing of database block read and write operations.
# Crucial: enables blk_read_time and blk_write_time in pg_stat_statements,
# allowing DBA/APM to clearly distinguish between CPU saturation and disk I/O bottlenecks.
track_io_timing = on

# ------------------------------------------------------------------------------
# 5. OVERHEAD AND HARDWARE CLOCK CONSIDERATIONS
# ------------------------------------------------------------------------------
# Overhead:
# - On modern Linux kernels (x86_64, aarch64) with hardware TSC (Time Stamp Counter),
#   the overhead of track_io_timing + pg_stat_statements is typically < 1% to 1.5% CPU.
#
# When to Disable track_io_timing:
# - Run the standard PostgreSQL benchmark tool:
#     pg_test_timing
# - If the result reports a loop time > 50-70 nanoseconds, or indicates that the OS
#   is falling back to ACPI PM timer or HPET (common in older KVM/hypervisor setups),
#   disable track_io_timing (track_io_timing = off) to avoid clock-reading latency penalty.
#
# ------------------------------------------------------------------------------
# 6. CONNECTION & TIMEOUT DEFAULTS
# ------------------------------------------------------------------------------
track_activities = on
track_counts = on
track_functions = pl

# Default fallbacks (overridden per-role in 002_monitoring_roles_and_timeouts.sql)
statement_timeout = 30000                        # 30 seconds default
idle_in_transaction_session_timeout = 60000      # 60 seconds
lock_timeout = 5000                              # 5 seconds
log_lock_waits = on
log_temp_files = 10240                           # Log temporary spill files > 10MB
