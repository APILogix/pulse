[databases]
;; PrimaryDB (Postgres max_connections = 40 -> Total PgBouncer server conns capped at 32, leaving 8 for direct/admin)
pulse_primary = host=pulse_primarydb port=5432 dbname=pulse_primary pool_mode=transaction pool_size=18 reserve_pool=2 max_db_connections=22
pulse_primary_session = host=pulse_primarydb port=5432 dbname=pulse_primary pool_mode=session pool_size=6 reserve_pool=2 max_db_connections=10

;; LogDB (Postgres max_connections = 60 -> Total PgBouncer server conns capped at 34, leaving 26 for direct ingestion/analytics + Timescale workers)
pulse_logdb = host=pulse_logdb port=5432 dbname=pulse_logdb pool_mode=transaction pool_size=20 reserve_pool=4 max_db_connections=26
pulse_logdb_session = host=pulse_logdb port=5432 dbname=pulse_logdb pool_mode=session pool_size=6 reserve_pool=2 max_db_connections=8

;; Fallback wildcard if needed
* = host=pulse_primarydb port=5432

[pgbouncer]
;; IP and port to listen on (inside container)
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Administrative users
admin_users = postgres
stats_users = postgres,monitor

;; Connection limits (Recalibrated for KVM 2: 2 vCPU, 8 GB RAM)
max_client_conn = 160
default_pool_size = 15
min_pool_size = 1
reserve_pool_size = 3
reserve_pool_timeout = 3
max_db_connections = 66

;; Critical if using prepared statements in node-pg with transaction pooling (PgBouncer 1.21+)
max_prepared_statements = 200

;; Timeouts (in seconds)
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 3
query_timeout = 60
idle_transaction_timeout = 120
client_idle_timeout = 0

;; Low-level network tuning
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepinterval = 10
tcp_keepcount = 3

;; Compatibility with Node.js pg and ORMs
;; Ignores startup parameter handshakes that PgBouncer doesn't track
ignore_startup_parameters = extra_float_digits,search_path,application_name

;; Log settings
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
