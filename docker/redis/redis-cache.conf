# ==============================================================================
# Redis Cache Instance Configuration (Volatile / Ephemeral Cache)
# Used for: lookup caches, dashboard query results, SDK config delivery caches
# Eviction: allkeys-lru (keys evicted when memory limit reached)
# Persistence: NONE (save disabled, AOF disabled for maximum write throughput)
# ==============================================================================

port 6380
bind 0.0.0.0
protected-mode yes

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 7

# Disable persistence for purely volatile cache instance
save ""
appendonly no

# TCP & timeouts
timeout 0
tcp-keepalive 300
tcp-backlog 511

# Latency and memory optimizations
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Logging
loglevel notice
