# ==============================================================================
# Redis State Instance Configuration (Durable State & Synchronization)
# Used for: streams, rate-limit counters, idempotency, auth sessions, alert cooldowns
# Eviction: noeviction (protects transactional/queue invariants; out-of-memory errors returned)
# Persistence: AOF everysec (durable state across process and node restarts)
# ==============================================================================

port 6379
bind 0.0.0.0
protected-mode yes

# Memory management
maxmemory 1gb
maxmemory-policy noeviction

# Durable Append-Only File persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots as secondary fallback
save 900 1
save 300 10
save 60 10000

# TCP & timeouts
timeout 0
tcp-keepalive 300
tcp-backlog 511

# Logging
loglevel notice
